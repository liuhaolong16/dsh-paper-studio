# 用 npm Trusted Publishing (OIDC) 发布 —— **不需要任何长期 token**
# 前置（在 npmjs.com 网站上一次即可，你的浏览器已登录）：
#   Package → Settings → Trusted Publisher → 选 GitHub Actions
#   填 Organization/user = liuhaolong16 · Repository = dsh-paper-studio · Workflow = publish-npm.yml
# 之后：① 打 v* 标签（push 触发）或 ② 网页手动触发，即可发布；凭据由 OIDC 短时签发，仓库里不存任何 secret。
# 说明：标签触发时 inputs.dry_run 为空 ⇒ 下方 `!inputs.dry_run` 为真 ⇒ 走**真发布**（演练请用网页手动触发）。
name: publish-npm

on:
  # 方式一（推荐给"只想发版"的场景）：打版本标签即发布。
  # ★ 只匹配 v*，因此回滚标签 pre-v* 不会误触发发布。
  push:
    tags:
      - 'v*'
  # 方式二：网页手动触发（可先跑 dry_run=true 演练）。
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只做打包与自检，不真正发布"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write          # OIDC 必需：换取 npm 短时凭据

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # ★ 不要写 registry-url：它会往 .npmrc 塞 `_authToken=${NODE_AUTH_TOKEN}`，
          #   而本工作流**不存任何 secret**；Trusted Publishing 要求 CLI 自动探测 OIDC 环境。
      # ★ Trusted Publishing 的硬前提（npm 官方文档）：npm CLI ≥ 11.5.1 + Node ≥ 22.14.0。
      #   setup-node 附带的 npm 是 10.x ⇒ 必须显式升级，否则发布会在鉴权处失败。
      - name: Use npm CLI >= 11.5.1 (trusted publishing requirement)
        run: |
          npm install -g npm@11
          node --version
          npm --version
      # ★ v3.2.79：CI 上必须先把依赖装上 —— 此前漏了这一步，citeproc 缺失让 3 条 refs 自检
      #   如实报「未安装 ⇒ 不算通过」⇒ 8 次标签触发全部在 20 余秒内红。锁文件已入库 ⇒ 用 npm ci。
      - name: Install dependencies (package-lock.json committed)
        run: npm ci --no-audit --no-fund
      # 自检先跑：不过就不发布（把门放在发布之前）
      - name: Self-checks (must pass before publishing)
        run: |
          node bin/studio.cjs selftest
          node bin/gate-runner.cjs --selftest
          node plugin/selftest.mjs
          node gates/_journal-contract.cjs --selftest
      - name: Show what would be published
        run: npm pack --dry-run
      - name: Publish (dry-run)
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run --access public
      - name: Publish (real, with provenance)
        if: ${{ !inputs.dry_run }}
        run: npm publish --provenance --access public
